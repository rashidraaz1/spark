<script>
// Add these functions for menu actions
function showAddDomainModal() {
    // This will be available on pages that have the modal
    if (typeof window.showAddDomainModal === 'function') {
        window.showAddDomainModal();
    } else {
        window.location.href = '{{ route("admin.cloudflare.accounts.index") }}';
    }
}

function syncAllFromMenu() {
    if (confirm('Sync all Cloudflare accounts now?')) {
        fetch('{{ route("admin.cloudflare.accounts.sync-all") }}', {
            method: 'POST',
            headers: {
                'X-CSRF-TOKEN': '{{ csrf_token() }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('✅ ' + data.message);
            } else {
                alert('❌ Error: ' + data.error);
            }
        })
        .catch(error => {
            alert('❌ Error syncing accounts');
        });
    }
}
</script>
